# www.xiyi.co unified storefront entry: desktop Web by default, H5 for phones.
map $http_user_agent $xiyi_device_view {
    default web;
    ~*(iPad|Tablet|PlayBook|Silk) web;
    ~*(Mobile|iPhone|iPod|Windows.Phone|IEMobile|Opera.Mini) h5;
}

map $arg_view $xiyi_query_view {
    default "";
    mobile h5;
    desktop web;
}

map $cookie_xiyi_view $xiyi_cookie_view {
    default "";
    mobile h5;
    desktop web;
}

map "$xiyi_query_view:$xiyi_cookie_view:$xiyi_device_view" $xiyi_selected_view {
    ~^h5: h5;
    ~^web: web;
    ~^:h5: h5;
    ~^:web: web;
    ~^::h5$ h5;
    default web;
}

map $xiyi_selected_view $xiyi_frontend_port {
    h5 18081;
    default 18080;
}

map $arg_view $xiyi_view_cookie {
    default "";
    mobile "xiyi_view=mobile; Path=/; Max-Age=86400; SameSite=Lax; Secure";
    desktop "xiyi_view=desktop; Path=/; Max-Age=86400; SameSite=Lax; Secure";
}

server {
    listen 80;
    server_name www.xiyi.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.xiyi.co;

    ssl_certificate /etc/letsencrypt/live/www.xiyi.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.xiyi.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        rewrite ^/api/api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:18089;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:18089;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        proxy_pass http://127.0.0.1:$xiyi_frontend_port;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Xiyi-View $xiyi_selected_view always;
        add_header Set-Cookie $xiyi_view_cookie always;
    }
}
