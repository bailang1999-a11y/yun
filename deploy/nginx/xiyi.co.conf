# 宿主机 nginx：web.xiyi.co / h5.xiyi.co / admin.xiyi.co
#
# 客户端 IP：每个转发到容器的 location 都必须把真实客户端地址写进
# X-Forwarded-For / X-Real-IP。容器内 nginx 只做透传，不会覆盖这两个头。
# 这里统一用 $remote_addr（覆盖写入）而不是 $proxy_add_x_forwarded_for，
# 避免客户端伪造 X-Forwarded-For 前缀绕过按 IP 的登录频率限制。
#
# ───────────── Web 用户端 web.xiyi.co ─────────────
server {
    listen 80;
    server_name web.xiyi.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name web.xiyi.co;
    ssl_certificate     /etc/letsencrypt/live/web.xiyi.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.xiyi.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 20m;
    location /api/ { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; }
    location /ws { proxy_pass http://127.0.0.1:18080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_read_timeout 3600s; }
    location /uploads/ { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; }
    location / { proxy_pass http://127.0.0.1:18080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ───────────── H5 端 h5.xiyi.co ─────────────
server {
    listen 80;
    server_name h5.xiyi.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name h5.xiyi.co;
    ssl_certificate     /etc/letsencrypt/live/web.xiyi.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.xiyi.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location /api/ { proxy_pass http://127.0.0.1:18081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ws { proxy_pass http://127.0.0.1:18081; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
    location / { proxy_pass http://127.0.0.1:18081; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ───────────── 管理后台 admin.xiyi.co ─────────────
server {
    listen 80;
    server_name admin.xiyi.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name admin.xiyi.co;
    ssl_certificate     /etc/letsencrypt/live/web.xiyi.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.xiyi.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location /ws {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
