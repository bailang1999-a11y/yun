server {
    listen 80;
    server_name api.xiyi.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.xiyi.co;

    ssl_certificate /etc/letsencrypt/live/api.xiyi.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xiyi.co/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location = / {
        default_type application/json;
        return 200 '{"service":"xiyiyun-api","status":"ok"}';
    }

    # Public machine-to-machine APIs. Admin, H5, WebSocket and uploads stay on their own hosts.
    location ~ ^/(?:api/(?:health(?:/live)?|member(?:/.*)?|payment(?:/.*)?|upstream(?:/.*)?|v1(?:/.*)?|rechargeapi(?:/.*)?|customer|product-list|buy|outer-order)|dockapiv3(?:/.*)?|agisoAcprSupplierApi(?:/.*)?|fzs-stdopen-api(?:/.*)?|user/balance/get|coupon/type/(?:list|goods/list)|order/(?:directCharge|get)|fc(?:searchbalance|userproductprice|gameonlinepay|searchpay)\.do)$ {
        proxy_pass http://127.0.0.1:18089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        default_type application/json;
        return 404 '{"code":404,"message":"API route not found"}';
    }
}
