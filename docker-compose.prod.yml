services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set mysql root password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set mysql database}
      MYSQL_USER: ${MYSQL_USER:?set mysql user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set mysql password}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-https://maven.aliyun.com/repository/public}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?set mysql database}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?set mysql user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set mysql password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
      XIYIYUN_ADMIN_USERNAME: ${XIYIYUN_ADMIN_USERNAME:?set admin username}
      XIYIYUN_ADMIN_PASSWORD_BCRYPT: ${XIYIYUN_ADMIN_PASSWORD_BCRYPT:?set admin bcrypt password hash}
      XIYIYUN_ADMIN_NICKNAME: ${XIYIYUN_ADMIN_NICKNAME:-运营管理员}
      XIYIYUN_PAYMENT_CALLBACK_SECRET: ${XIYIYUN_PAYMENT_CALLBACK_SECRET:?set payment callback secret}
      XIYIYUN_CARD_ENCRYPTION_SECRET: ${XIYIYUN_CARD_ENCRYPTION_SECRET:?set card encryption secret}
      XIYIYUN_AGISO_ENABLED: ${XIYIYUN_AGISO_ENABLED:-false}
      XIYIYUN_AGISO_APP_ID: ${XIYIYUN_AGISO_APP_ID:-}
      XIYIYUN_AGISO_APP_SECRET: ${XIYIYUN_AGISO_APP_SECRET:-}
      XIYIYUN_CORS_ALLOWED_ORIGINS: ${XIYIYUN_CORS_ALLOWED_ORIGINS:?set comma-separated CORS allowed origins}
      XIYIYUN_UPLOAD_DIR: /data/uploads
      XIYIYUN_PAYMENT_CALLBACK_STRICT_SIGNATURE: ${XIYIYUN_PAYMENT_CALLBACK_STRICT_SIGNATURE:-true}
      XIYIYUN_LOGIN_ADMIN-CAPTCHA-REQUIRED: "false"
    volumes:
      - upload-data:/data/uploads
    ports:
      - "${XIYIYUN_HTTP_BIND:-127.0.0.1}:${API_PORT:-18089}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${XIYIYUN_HTTP_BIND:-127.0.0.1}:${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  h5:
    build:
      context: .
      dockerfile: apps/h5/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${XIYIYUN_HTTP_BIND:-127.0.0.1}:${H5_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        VITE_ADMIN_API_BASE_URL: /api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      - "${XIYIYUN_HTTP_BIND:-127.0.0.1}:${ADMIN_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  upload-data:
